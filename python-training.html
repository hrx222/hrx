    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        
        code, pre {
            font-family: 'JetBrains Mono', monospace;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .card-hover {
            transition: all 0.3s ease;
        }
        
        .card-hover:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(102, 126, 234, 0.15);
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .slide-in {
            animation: slideIn 0.5s ease;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .quiz-option {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .quiz-option:hover {
            transform: scale(1.02);
        }
        
        .quiz-option.correct {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border-color: #059669;
        }
        
        .quiz-option.incorrect {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            border-color: #dc2626;
        }
        
        .progress-ring {
            transition: stroke-dashoffset 0.5s ease;
        }
        
        .match-card {
            transition: all 0.3s ease;
        }
        
        .match-card.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }
        
        .dark body {
            background: #1a1a2e;
        }
    </style>

        function renderQuizQuestion() {
            if (!currentQuiz) return '';
            
            const question = currentQuiz.questions[currentQuestionIndex];
            const progress = ((currentQuestionIndex + 1) / currentQuiz.questions.length) * 100;
            
            return `
                <div class="container mx-auto px-4 py-8">
                    <div class="max-w-3xl mx-auto">
                        <button onclick="navigate('quiz')" class="mb-6 inline-flex items-center text-gray-600 hover:text-purple-600 transition-colors">

                        <div class="bg-white rounded-2xl shadow-lg p-8 fade-in">
                            <div class="mb-6">
                                <div class="flex items-center justify-between mb-2">
                                    <span class="text-sm text-gray-600">${currentQuiz.category}</span>
                                    <span class="text-sm text-gray-600">${currentQuestionIndex + 1} / ${currentQuiz.questions.length}</span>
                                </div>
                                <div class="w-full bg-gray-200 rounded-full h-2">
                                    <div class="gradient-bg h-2 rounded-full progress-ring" style="width: ${progress}%"></div>
                                </div>
                            </div>

                            <h2 class="text-2xl font-bold mb-8 text-gray-800">${question.question}</h2>

                            <div class="space-y-4">
                                ${question.options.map((option, index) => `
                                    <div onclick="selectAnswer(${index})" class="quiz-option p-4 border-2 border-gray-200 rounded-xl ${selectedAnswer === index ? (index === question.correct ? 'correct' : 'incorrect') : ''}">
                                        <div class="flex items-center">
                                            <div class="w-8 h-8 border-2 border-gray-300 rounded-lg flex items-center justify-center mr-4 font-bold text-gray-600 ${selectedAnswer === index ? 'border-transparent' : ''}">
                                                ${String.fromCharCode(65 + index)}
                                            </div>
                                            <span class="text-lg">${option}</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>

                            ${selectedAnswer !== null ? `
                                <div class="mt-6 p-4 bg-blue-50 rounded-xl border border-blue-200 slide-in">
                                    <div class="flex items-start">
                                        <svg class="h-6 w-6 text-blue-500 mr-3 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                        </svg>
                                        <div>
                                            <h4 class="font-semibold text-blue-800 mb-2">答案解析</h4>
                                            <p class="text-blue-700 text-sm">${question.explanation}</p>
                                        </div>
                                    </div>
                                </div>

                                <div class="mt-6 flex justify-between">
                                    ${currentQuestionIndex > 0 ? `
                                        <button onclick="prevQuestion()" class="px-6 py-3 bg-gray-100 text-gray-700 rounded-lg font-medium hover:bg-gray-200 transition-colors">
                                            上一题
                                        </button>
                                    ` : '<div></div>'}
                                    
                                    ${currentQuestionIndex < currentQuiz.questions.length - 1 ? `
                                        <button onclick="nextQuestion()" class="px-6 py-3 gradient-bg text-white rounded-lg font-medium hover:opacity-90 transition-opacity">
                                            下一题
                                        </button>
                                    ` : `
                                        <button onclick="finishQuiz()" class="px-6 py-3 bg-green-500 text-white rounded-lg font-medium hover:bg-green-600 transition-colors">
                                            完成训练
                                        </button>
                                    `}
                                </div>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            selectedAnswer = index;
            render();
        }

        function nextQuestion() {
            currentQuestionIndex++;
            selectedAnswer = null;
            render();
        }

        function prevQuestion() {
            currentQuestionIndex--;
            selectedAnswer = null;
            render();
        }

        function finishQuiz() {
            const correct = selectedAnswer === currentQuiz.questions[currentQuestionIndex].correct;
            if (correct) {
                userData.correctAnswers++;
            }
            userData.totalQuizzes++;
            
            userData.quizScores.push({
                category: currentQuiz.category,
                score: correct ? 1 : 0,
                date: new Date().toISOString()
            });
            
            saveProgress();
            alert(`🎉 训练完成！\n\n分类：${currentQuiz.category}\n正确答案：${userData.correctAnswers}/${userData.totalQuizzes}`);
            navigate('quiz');
        }

                                                <span class="text-sm font-medium text-gray-700">${skill.name}</span>
                                                <span class="text-sm font-medium text-purple-600">${skill.level}%</span>
                                            </div>
                                            <div class="w-full bg-gray-200 rounded-full h-2">
                                                <div class="gradient-bg h-2 rounded-full" style="width: ${skill.level}%"></div>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>

                        <div class="bg-gradient-to-r from-purple-50 to-blue-50 rounded-2xl p-6 border border-purple-100">
                            <h2 class="text-xl font-bold text-gray-800 mb-4">💡 学习建议</h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div class="flex items-start">
                                    <div class="w-8 h-8 gradient-bg rounded-lg flex items-center justify-center mr-3">
                                        <svg class="h-4 w-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                                        </svg>
                                    </div>
                                    <div>
                                        <h3 class="font-semibold text-gray-800 mb-1">坚持每日练习</h3>
                                        <p class="text-sm text-gray-600">每天完成至少一个项目或一套练习题</p>
                                    </div>
                                </div>
                                <div class="flex items-start">
                                    <div class="w-8 h-8 gradient-bg rounded-lg flex items-center justify-center mr-3">
                                        <svg class="h-4 w-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                                        </svg>
                                    </div>
                                    <div>
                                        <h3 class="font-semibold text-gray-800 mb-1">动手实践</h3>
                                        <p class="text-sm text-gray-600">不要只看代码，要自己动手编写和运行</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            if (email === 'test@example.com' && password === 'password123') {
                isLoggedIn = true;
                saveProgress();
                alert('🎉 登录成功！欢迎回来继续学习！');
                navigate('profile');
            } else {
                alert('❌ 邮箱或密码错误！\n\n测试账号：\n邮箱: test@example.com\n密码: password123');
            }
        }

        function handleRegister(event) {
            event.preventDefault();
            const password = document.getElementById('register-password').value;
            const confirm = document.getElementById('register-confirm').value;
            if (password !== confirm) {
                alert('❌ 两次输入的密码不一致！');
                return;
            }
            const name = document.getElementById('register-name').value;
            const email = document.getElementById('register-email').value;
            userData.name = name || '新用户';
            userData.email = email || 'user@example.com';
            isLoggedIn = true;
            saveProgress();
            alert('🎉 注册成功！欢迎加入Python学习大家庭！');
            setTimeout(() => navigate('profile'), 1500);
        }

        function runCode() {
            const code = document.getElementById('code-editor').value;
            codeOutput = `>>> 代码运行成功！

请注意: 这是一个模拟的Python环境。
在实际使用时，代码将在真实的Python解释器中运行。

--- 你的代码 ---
${code}

--- 建议 ---
1. 仔细阅读代码注释
2. 尝试修改参数，观察结果变化
3. 遇到问题时，可以向AI助手提问`;
            render();
        }

        function submitProject() {
            if (currentProject) {
                const isCompleted = completedProjects.some(p => p.id === currentProject.id);
                if (!isCompleted) {
                    completedProjects.push({
                        id: currentProject.id,
                        title: currentProject.title,
                        completedAt: new Date().toISOString().split('T')[0],
                        score: Math.floor(Math.random() * 15) + 85
                    });
                    userData.completedProjects++;
                    saveProgress();
                }
            }
            codeOutput = `🎉 恭喜！项目提交成功！

你的学习进度已保存。
当前完成项目数: ${userData.completedProjects}/${userData.totalProjects}
继续加油，完成更多项目吧！`;
            render();
        }

        function quickChat(message) {
            let response = `好的，我理解了你的问题。让我来帮你解答...`;
            if (message.includes('错误') || message.includes('报错')) {
                response = `遇到错误了吗？请仔细检查：
1. 语法是否正确
2. 缩进是否一致
3. 括号是否匹配
4. 变量名是否正确`;
            } else if (message.includes('怎么') || message.includes('如何')) {
                response = `让我来教你：
1. 首先理解问题的核心
2. 参考示例代码的结构
3. 按照步骤实现
4. 运行测试验证`;
            } else if (message.includes('不懂') || message.includes('帮助')) {
                response = `别担心，学习是一个渐进的过程。建议：
1. 先通读代码，理解整体结构
2. 逐行分析代码的作用
3. 运行代码观察输出
4. 多练习，多思考`;
            }
            alert(`AI助手说: ${response}`);
        }

        function copyCode() {
            const code = document.getElementById('code-editor').value;
            navigator.clipboard.writeText(code).then(() => {
                alert('✅ 代码已复制到剪贴板!');
            });
        }

        function filterProjects() {
            if (!searchQuery.trim()) return projects;
            return projects.filter(p => 
                p.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                p.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
                p.tasks.some(t => t.toLowerCase().includes(searchQuery.toLowerCase()))
            );
        }

        function handleSearch(event) {
            searchQuery = event.target.value;
            render();
        }

        // 初始化
        loadProgress();
        loadDarkMode();
        render();
    </script>
</body>
</html>
